name: Weekly GoFish Summary
on:
  schedule:
    - cron: "0 8 * * 4" # Thursdays at 4am Eastern (8am UTC)
  workflow_dispatch: # Allow manual triggers
    inputs:
      dry_run:
        description: "Dry run mode (skip Discord posting, output to logs)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history for git log

      - name: Get summary window
        id: dates
        run: |
          # Summarize the most recent Thursday→Thursday week that has fully
          # elapsed, with both boundaries quantized to the cron anchor (Thu
          # 08:00 UTC) rather than to when this run actually fired. GitHub's
          # scheduled runs jitter (08:00 cron has fired anywhere from 10:58 to
          # 12:08), so a fire-time-relative window was imprecise and could drop
          # PRs merged on the run day after the previous summary went out. Fixed
          # boundaries make the windows deterministic and exactly contiguous: a
          # PR merged at any instant falls in exactly one week's window.
          ANCHOR_DOW=4 # Thursday (date +%u: Mon=1 … Sun=7)
          ANCHOR_HOUR=08
          # Most recent anchor weekday's date (today if today is that weekday).
          BACK=$(( ( $(date -u +%u) - ANCHOR_DOW + 7 ) % 7 ))
          UPPER_TS="$(date -u -d "${BACK} days ago" +%Y-%m-%d)T${ANCHOR_HOUR}:00:00Z"
          # If that anchor instant is still in the future (run fired before
          # 08:00 on the anchor day), step back a full week.
          if [ "$(date -u -d "$UPPER_TS" +%s)" -gt "$(date -u +%s)" ]; then
            UPPER_TS="$(date -u -d "$UPPER_TS - 7 days" +%Y-%m-%dT%H:%M:%SZ)"
          fi
          LOWER_TS="$(date -u -d "$UPPER_TS - 7 days" +%Y-%m-%dT%H:%M:%SZ)"
          # GitHub's search wants an explicit UTC offset, not the "Z" shorthand.
          echo "lower=${LOWER_TS/Z/+00:00}" >> $GITHUB_OUTPUT
          echo "upper=${UPPER_TS/Z/+00:00}" >> $GITHUB_OUTPUT
          echo "lower_label=$(date -u -d "$LOWER_TS" +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "upper_label=$(date -u -d "$UPPER_TS" +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Get merged PRs for the window
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Half-open interval [lower, upper): a PR merged exactly on a boundary
          # belongs to one window only, never both.
          PRS=$(gh pr list \
            --state merged \
            --search "merged:>=${{ steps.dates.outputs.lower }} merged:<${{ steps.dates.outputs.upper }}" \
            --json number,title,body,author,mergedAt,url \
            --jq '.[] | "### PR #\(.number): \(.title)\n- **Author:** \(.author.login)\n- **Merged:** \(.mergedAt[:10])\n- **URL:** \(.url)\n- **Description:** \(.body // "No description" | split("\n")[0:3] | join(" ") | .[0:300])\n"')
          if [ -z "$PRS" ]; then
            PRS="No PRs merged this week."
          fi
          # Store in file to avoid escaping issues
          echo "$PRS" > prs.txt

      - name: Summarize with Claude
        id: summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          bash .github/scripts/summarize-with-claude.sh

      - name: Display summary (always shown)
        run: |
          echo "## 📋 Generated Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat summary.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

          # Also output to console for easy viewing
          echo "=========================================="
          echo "GENERATED SUMMARY:"
          echo "=========================================="
          cat summary.md
          echo "=========================================="

      - name: Post to Discord
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true') }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TITLE: "# 🐟 GoFish Weekly Update (${{ steps.dates.outputs.lower_label }} → ${{ steps.dates.outputs.upper_label }})"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️  DISCORD_WEBHOOK_URL secret not set. Skipping Discord post."
            exit 0
          fi

          # A Discord message's content field is capped at 2000 chars, so a long
          # summary (a big PR week) must be split across several messages or
          # Discord rejects the post. Prepend the title, then chunk at line
          # boundaries, staying under 1900 to leave headroom, and hard-wrap any
          # single line that is itself too long. When a chunk would end on a
          # header line, carry that header over to start the next chunk instead.
          jq -n \
            --arg title "$TITLE" \
            --rawfile summary summary.md \
            --argjson max 1900 \
            '
              def chunk($limit):
                reduce (./"\n")[] as $line ({chunks: [], cur: ""};
                  (if ($line | length) == 0 then [""]
                   else ($line | [while(length > 0; .[$limit:]) | .[:$limit]]) end) as $parts
                  | reduce $parts[] as $p (.;
                      if (.cur | length) == 0 then .cur = $p
                      elif ((.cur | length) + 1 + ($p | length)) <= $limit
                        then .cur = .cur + "\n" + $p
                      else
                        (.cur / "\n") as $ls
                        | if ($ls | length) > 1 and ($ls[-1] | startswith("#"))
                             and (($ls[-1] | length) + 1 + ($p | length)) <= $limit
                          then .chunks += [$ls[:-1] | join("\n")] | .cur = $ls[-1] + "\n" + $p
                          else .chunks += [.cur] | .cur = $p
                          end
                      end))
                | .chunks + (if (.cur | length) > 0 then [.cur] else [] end);
              ($title + "\n\n" + $summary) | chunk($max)
            ' > chunks.json

          # Post one message per chunk, in order. With ?wait=true Discord returns
          # HTTP 200 and the created message; on rejection it returns a 4xx with
          # an error body. curl does not fail on an error status, so check it
          # explicitly; otherwise a rejected post leaves the job green and the
          # failure goes unnoticed. allowed_mentions.parse = [] keeps a summary
          # from ever pinging @everyone, roles, or users.
          COUNT=$(jq 'length' chunks.json)
          for i in $(seq 0 $((COUNT - 1))); do
            jq -c --argjson i "$i" \
              '{content: .[$i], allowed_mentions: {parse: []}}' \
              chunks.json > payload.json
            HTTP_CODE=$(curl -sS -X POST "$DISCORD_WEBHOOK_URL?wait=true" \
              -H "Content-Type: application/json" \
              --data @payload.json \
              -w "%{http_code}" -o discord_response.txt)
            RESPONSE=$(cat discord_response.txt)
            echo "Discord responded HTTP $HTTP_CODE for message $((i + 1))/$COUNT"

            if [ "${HTTP_CODE:0:1}" != "2" ]; then
              echo "::error::Discord rejected the weekly summary (HTTP $HTTP_CODE): $RESPONSE"
              exit 1
            fi
            # Stay clear of the webhook rate limit between messages.
            if [ "$i" -lt $((COUNT - 1)) ]; then
              sleep 1
            fi
          done
          echo "✅ Weekly summary posted to Discord ($COUNT message(s))."

      - name: Dry run notice
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          echo "✅ DRY RUN MODE: Summary generated but NOT posted to Discord"
          echo "To post to Discord, run the workflow with dry_run set to 'false'"
