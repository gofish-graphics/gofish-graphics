name: Weekly GoFish Summary
on:
  schedule:
    - cron: "0 8 * * 4" # Thursdays at 4am Eastern (8am UTC)
  workflow_dispatch: # Allow manual triggers
    inputs:
      dry_run:
        description: "Dry run mode (skip Discord posting and the archive PR, output to logs)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      # The archive PR is pushed and opened with the summary bot app token,
      # so GITHUB_TOKEN only needs to read.
      contents: read
      pull-requests: read # gh pr list
      id-token: write # claude-code-action authenticates to GitHub via OIDC
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history for git log

      - name: Get summary window
        id: dates
        run: |
          # Summarize the most recent Thursday→Thursday week that has fully
          # elapsed, with both boundaries quantized to the cron anchor (Thu
          # 08:00 UTC) rather than to when this run actually fired. GitHub's
          # scheduled runs jitter (08:00 cron has fired anywhere from 10:58 to
          # 12:08), so a fire-time-relative window was imprecise and could drop
          # PRs merged on the run day after the previous summary went out. Fixed
          # boundaries make the windows deterministic and exactly contiguous: a
          # PR merged at any instant falls in exactly one week's window.
          ANCHOR_DOW=4 # Thursday (date +%u: Mon=1 … Sun=7)
          ANCHOR_HOUR=08
          # Most recent anchor weekday's date (today if today is that weekday).
          BACK=$(( ( $(date -u +%u) - ANCHOR_DOW + 7 ) % 7 ))
          UPPER_TS="$(date -u -d "${BACK} days ago" +%Y-%m-%d)T${ANCHOR_HOUR}:00:00Z"
          # If that anchor instant is still in the future (run fired before
          # 08:00 on the anchor day), step back a full week.
          if [ "$(date -u -d "$UPPER_TS" +%s)" -gt "$(date -u +%s)" ]; then
            UPPER_TS="$(date -u -d "$UPPER_TS - 7 days" +%Y-%m-%dT%H:%M:%SZ)"
          fi
          LOWER_TS="$(date -u -d "$UPPER_TS - 7 days" +%Y-%m-%dT%H:%M:%SZ)"
          # GitHub's search wants an explicit UTC offset, not the "Z" shorthand.
          echo "lower=${LOWER_TS/Z/+00:00}" >> $GITHUB_OUTPUT
          echo "upper=${UPPER_TS/Z/+00:00}" >> $GITHUB_OUTPUT
          echo "lower_label=$(date -u -d "$LOWER_TS" +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "upper_label=$(date -u -d "$UPPER_TS" +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Get merged PRs for the window
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The maintainer's PRs (and bots') carry no Author line, so the
          # summary only credits outside contributors.
          MAINTAINER: joshpoll
        run: |
          # Half-open interval [lower, upper): a PR merged exactly on a boundary
          # belongs to one window only, never both.
          #
          # The description is cut to 300 chars, but the screenshots a PR body
          # embeds are pulled from the full body first, so the summary can show
          # new charts. Bodies embed them as Markdown (![alt](url)) or as HTML
          # (<img src="...">, which GitHub's uploader writes). Each image is
          # listed once, in body order, as a ready-to-copy ![alt](url) line;
          # build-summary-prompt.sh turns these lines into the URL allowlist.
          PRS=$(gh pr list \
            --state merged \
            --search "merged:>=${{ steps.dates.outputs.lower }} merged:<${{ steps.dates.outputs.upper }}" \
            --json number,title,body,author,mergedAt,url \
            --jq '
              def images:
                [ (match("!\\[(?<alt>[^\\]]*)\\]\\((?<url>[^)\\s]+)(?:\\s+\"[^\"]*\")?\\)"; "g")
                    | {offset, alt: .captures[0].string, url: .captures[1].string}),
                  (match("<img\\b[^>]*>"; "gi")
                    | .offset as $o | .string as $tag
                    | {offset: $o,
                       url: ($tag | capture("\\bsrc\\s*=\\s*[\"'\''](?<u>[^\"'\'']+)[\"'\'']"; "i").u),
                       alt: ([$tag | capture("\\balt\\s*=\\s*[\"'\''](?<a>[^\"'\'']*)[\"'\'']"; "i").a] | first // "")})
                ]
                | sort_by(.offset)
                | reduce .[] as $img ([]; if any(.[]; .url == $img.url) then . else . + [$img] end)
                | map(select(.url | test("^https?://")));
              .[]
              | ((.body // "") | images) as $images
              | "### PR #\(.number): \(.title)\(if .author.is_bot or .author.login == env.MAINTAINER then "" else "\n- **Author:** \(.author.login)" end)\n- **Merged:** \(.mergedAt[:10])\n- **URL:** \(.url)\n- **Description:** \(.body // "No description" | split("\n")[0:3] | join(" ") | .[0:300])\(if ($images | length) > 0 then "\n- **Images:**" + ($images | map("\n  - ![\(.alt | gsub("[\\[\\]\\r\\n]"; " "))](\(.url))") | join("")) else "" end)\n"
            ')
          if [ -z "$PRS" ]; then
            PRS="No PRs merged this week."
          fi
          # Store in file to avoid escaping issues
          echo "$PRS" > prs.txt

      - name: Build summary prompt
        run: |
          bash .github/scripts/build-summary-prompt.sh

      # Runs on the maintainer's Claude subscription via the OAuth token, like
      # the other Claude workflows. Claude reads prompt.md and writes the
      # summary to summary.md; it gets no tools beyond reading and writing.
      - name: Summarize with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read the file prompt.md in the repository root and follow its instructions exactly."
          claude_args: |
            --allowedTools "Read,Write"
            --max-turns 5

      - name: Check summary
        run: |
          bash .github/scripts/check-summary.sh

      - name: Display summary (always shown)
        run: |
          echo "## 📋 Generated Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat summary.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

          # Also output to console for easy viewing
          echo "=========================================="
          echo "GENERATED SUMMARY:"
          echo "=========================================="
          cat summary.md
          echo "=========================================="

      - name: Post to Discord
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true') }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TITLE: "# 🐟 GoFish Weekly Update (${{ steps.dates.outputs.lower_label }} → ${{ steps.dates.outputs.upper_label }})"
        # Chunks the summary under Discord's message limit and uploads its
        # screenshots as files, each right after the bullet it illustrates.
        # Run it locally with DRY_RUN=1 to see the messages without posting.
        run: |
          bash .github/scripts/post-to-discord.sh

      # Archive this week's summary to main at summaries/<upper_label>.md so it
      # can feed release notes and the website later. main requires status
      # checks, so the commit goes through a PR that auto-merges once they pass.
      # The PR is opened by the summary bot, a GitHub App: PRs opened with
      # GITHUB_TOKEN do not trigger CI, so the required checks would never run.
      # The Bot PR Guard workflow keeps the bot's PRs limited to summaries/.
      - name: Check archive configuration
        id: archive-config
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true') }}
        env:
          APP_ID: ${{ secrets.SUMMARY_BOT_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "⚠️  SUMMARY_BOT_APP_ID secret not set. Skipping the archive PR."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint summary bot token
        id: app-token
        if: ${{ steps.archive-config.outputs.configured == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SUMMARY_BOT_APP_ID }}
          private-key: ${{ secrets.SUMMARY_BOT_PRIVATE_KEY }}

      - name: Archive summary
        if: ${{ steps.archive-config.outputs.configured == 'true' }}
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          BOT_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          LOWER_LABEL: ${{ steps.dates.outputs.lower_label }}
          UPPER_LABEL: ${{ steps.dates.outputs.upper_label }}
        run: |
          set -euo pipefail
          FILE="summaries/${UPPER_LABEL}.md"
          BRANCH="weekly-summary/${UPPER_LABEL}"
          TITLE="Add weekly summary for ${LOWER_LABEL} → ${UPPER_LABEL}"

          # Assemble the entry outside the checkout, before switching branches.
          TMP_DIR="${RUNNER_TEMP:-$(mktemp -d)}"
          ENTRY="$TMP_DIR/weekly-summary-entry.md"
          {
            printf '# 🐟 GoFish Weekly Update (%s → %s)\n\n' "$LOWER_LABEL" "$UPPER_LABEL"
            cat summary.md
          } > "$ENTRY"

          git fetch origin main
          git checkout -B "$BRANCH" origin/main

          # A re-run after the PR already merged: main has this exact file.
          if [ -f "$FILE" ] && cmp -s "$ENTRY" "$FILE"; then
            echo "✅ $FILE is already on main with identical content; nothing to do."
            exit 0
          fi

          mkdir -p summaries
          cp "$ENTRY" "$FILE"
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add "$FILE"
          git commit -q -m "$TITLE"
          # --force so a re-run after a failed merge refreshes the branch.
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

          export GH_TOKEN="$TOKEN"
          PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            echo "Reusing open PR #$PR for $BRANCH."
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" \
              --body "Auto-generated by the weekly-summary workflow. It adds this week's summary at \`$FILE\` and auto-merges once the required checks pass."
            PR="$BRANCH"
          fi
          gh pr merge "$PR" --auto --squash --delete-branch
          echo "✅ The archive PR for $FILE is set to auto-merge once checks pass."

      - name: Dry run notice
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          echo "✅ DRY RUN MODE: Summary generated but NOT posted to Discord and NOT archived (no archive PR opened)"
          echo "To post to Discord and open the archive PR, run the workflow with dry_run set to 'false'"
