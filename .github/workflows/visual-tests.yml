name: Visual Tests

on:
  push:
    branches:
      - main
    paths:
      - "packages/gofish-graphics/**"
      - "packages/gofish-python/**"
      - "tests/**"

  # No pull_request paths filter: this workflow is a required status check,
  # so it must always trigger and report. The cheap `changes` job below
  # decides whether the real work runs. When nothing relevant changed the
  # heavy jobs are skipped (a skipped job counts as success for required
  # checks) instead of the workflow never starting (which would leave the
  # check pending and block the PR forever).
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - "packages/gofish-graphics/**"
              - "packages/gofish-python/**"
              - "tests/**"
              - ".github/workflows/visual-tests.yml"
              - ".github/actions/**"

  # Capturing every story is the expensive part of the visual tests.
  # It runs once per commit, split into shards that capture disjoint sets of
  # stories on parallel runners (capture-js-dom.ts --shard i/N). Each shard
  # uploads a `js-dom-capture-<i>` artifact, and the consumers download all of
  # them into one `tests/tmp/js/`, the same tree an unsharded capture writes.
  # Two jobs consume it in parallel: `visual-test` compares it against the
  # snapshot baselines, and `python-parity` compares the Python capture
  # against it. Accepting diffs on the review site re-runs only the cheap
  # `visual-test` compare job (#871), and parity no longer waits on the
  # visual review (#872).
  js-capture:
    needs: changes
    # On push (already path-filtered above) always run; on PRs run only when
    # relevant files changed, otherwise skip (= success for required checks).
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    # A failed shard cancels the others: the capture is incomplete anyway, and
    # the consumers fail on any result but success.
    strategy:
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MS core fonts
        uses: ./.github/actions/setup-ms-fonts

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # No gofish-graphics build: the capture harness aliases gofish-graphics
      # to its source (tests/harness/vite.config.ts), and gofish-ir builds its
      # dist in its own `prepare` script during install.
      - name: Install Node dependencies
        run: pnpm install

      - name: Set up Playwright
        uses: ./.github/actions/setup-playwright

      - name: Capture JS DOM snapshots
        run: pnpm --filter @gofish/tests capture-js --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload JS DOM capture
        uses: actions/upload-artifact@v5
        with:
          name: js-dom-capture-${{ matrix.shard }}
          path: tests/tmp/js
          if-no-files-found: error

  visual-test:
    needs: js-capture
    # A job whose `needs` failed is skipped, and a skipped job counts as
    # success for required checks. So run whenever js-capture ran at all and
    # fail explicitly below if it did not succeed; skip only when js-capture
    # itself was skipped (nothing relevant changed).
    if: ${{ !cancelled() && needs.js-capture.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write # needed to push to snapshots/main on main push
      statuses: write # needed to publish review-link commit status

    steps:
      - name: Fail if the JS capture failed
        if: needs.js-capture.result != 'success'
        run: |
          echo "::error::js-capture finished with '${{ needs.js-capture.result }}'; there is no capture to compare."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Git LFS
        run: git lfs install

      - name: Fetch snapshot baselines
        run: |
          SNAP_BRANCH="snapshots/${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          FOUND=""
          if git ls-remote --exit-code origin "$SNAP_BRANCH" 2>/dev/null; then
            FOUND="$SNAP_BRANCH"
          elif git ls-remote --exit-code origin "snapshots/main" 2>/dev/null; then
            FOUND="snapshots/main"
          fi
          mkdir -p __snapshots__/dom __snapshots__/screenshots
          if [ -n "$FOUND" ]; then
            git fetch origin "$FOUND"
            FETCH_SHA=$(git rev-parse FETCH_HEAD)
            git worktree add --detach /tmp/snap-baselines "$FETCH_SHA"
            cd /tmp/snap-baselines && git lfs pull && cd -
            # Copy SRC contents (SRC/.) into existing DEST so a pre-existing
            # __snapshots__/dom doesn't end up nested as __snapshots__/dom/dom.
            [ -d /tmp/snap-baselines/dom ] && cp -r /tmp/snap-baselines/dom/. __snapshots__/dom/
            [ -d /tmp/snap-baselines/screenshots ] && cp -r /tmp/snap-baselines/screenshots/. __snapshots__/screenshots/
            git worktree remove --force /tmp/snap-baselines
          else
            echo "No snapshot branch found; starting with empty baselines."
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install

      # Artifacts belong to the workflow run, not the attempt, so the re-run
      # the review site's accept action triggers still finds this capture.
      # The shards merge into the full capture (see js-capture), so the
      # removed-stories check in compare.ts and the snapshot update on main
      # both see every story.
      - name: Download JS DOM capture
        uses: actions/download-artifact@v5
        with:
          pattern: js-dom-capture-*
          merge-multiple: true
          path: tests/tmp/js

      # On PRs: compare against baselines and fail if regressions are detected.
      - name: Compare snapshots (PR only)
        if: github.event_name == 'pull_request'
        run: pnpm --filter @gofish/tests exec tsx scripts/compare.ts --js-only

      # Removed stories now fail compare.ts like any other unreviewed change
      # (baseline exists, story no longer present), so this only ever runs
      # alongside the other failure-path steps below (upload/review site).
      # Kept as a quick-glance summary in the Checks tab, without needing to
      # open the review site, for the common "just deleted a story" case.
      - name: Report removed stories (PR only)
        if: failure() && github.event_name == 'pull_request'
        run: |
          SUMMARY=tests/tmp/diff-summary.json
          if [ -f "$SUMMARY" ] && [ "$(jq '.removed // 0' "$SUMMARY")" -gt 0 ]; then
            {
              echo "### Removed stories"
              echo ""
              echo "Baseline exists but the story is no longer present. Accept the removal in the review site to delete its baseline (or restore the story):"
              echo ""
              jq -r '.removedStories[] | "- `\(.)`"' "$SUMMARY"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # On main push: auto-accept all captures as the new baselines and push
      # to snapshots/main. This keeps snapshots/main in sync after every merge.
      - name: Configure git for snapshot commit (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Auto-update snapshots/main (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter @gofish/tests update-baselines

      # diff-list.json is the machine-readable list of the diffs this run
      # reported; `accept-baselines.ts --all` accepts exactly those.
      - name: Upload diff report
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: visual-diff-report
          path: |
            tests/tmp/diff-report.html
            tests/tmp/diff-list.json

      - name: Build review site
        if: failure() && github.event_name == 'pull_request'
        run: pnpm --filter @gofish/tests build:review-site
        env:
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
          # For pull_request events, github.sha is the *merge* commit, not the
          # PR head. Statuses must be posted on the PR head SHA so they appear
          # on the PR's checks list, so prefer pull_request.head.sha when set.
          REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_RUN_ID: ${{ github.run_id }}

      - name: Deploy review site to Cloudflare Pages
        if: failure() && github.event_name == 'pull_request'
        id: deploy-review
        run: |
          output=$(npx wrangler@latest --cwd tests/tmp/review-site pages deploy . \
            --project-name=gofish-visual-review \
            --branch="${{ github.head_ref || github.ref_name }}" \
            --commit-dirty=true 2>&1) || { echo "$output"; exit 1; }
          echo "$output"
          # Link this deployment's own URL, not the branch alias wrangler prints
          # last: the alias serves whichever run of the branch deployed most
          # recently, so a status on one commit could open (and accept against)
          # another commit's run.
          url=$(echo "$output" | grep -F 'Take a peek over at' | grep -oE 'https://[a-zA-Z0-9._-]+\.pages\.dev[a-zA-Z0-9._/-]*' | head -1)
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"

      # Publish a commit status whose Details link jumps directly to the review
      # app (no intermediate GitHub page, unlike check runs). Mirrors the UX of
      # services like Chromatic.
      - name: Publish review-link commit status
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const url = '${{ steps.deploy-review.outputs.deployment-url }}';
            if (!url) return;

            // Build a description from the diff summary, omitting zero-count
            // categories. Falls back to a generic message if the summary is
            // missing.
            const summaryPath = 'tests/tmp/diff-summary.json';
            let description = 'Click Details to review and accept diffs';
            try {
              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              const parts = [];
              const plural = (n, singular, pluralForm) =>
                `${n} ${n === 1 ? singular : pluralForm}`;
              if (summary.regressions > 0) {
                parts.push(plural(summary.regressions, 'regression', 'regressions'));
              }
              if (summary.newStories > 0) {
                parts.push(plural(summary.newStories, 'new story', 'new stories'));
              }
              // Removed stories fail the job like any other unreviewed
              // change (see compare.ts) — surfaced here since this
              // description is the first thing seen on the PR's checks list.
              if (summary.removed > 0) {
                parts.push(plural(summary.removed, 'removed story', 'removed stories'));
              }
              if (parts.length > 0) {
                description = parts.join(', ') + ' — click Details to review';
              }
            } catch (e) {
              // keep fallback description
            }

            // GitHub's max description length is 140 chars.
            if (description.length > 140) description = description.slice(0, 140);

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              target_url: url,
              description,
              context: 'Visual Diff Review',
            });

  # Captures the Python stories. It needs nothing from js-capture, so it runs
  # alongside it; only python-parity, which compares the two, waits for both.
  python-capture:
    needs: changes
    # Same condition as js-capture, so the two are skipped together.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Same fonts as js-capture, so both captures measure text against the
      # same font files.
      - name: Set up MS core fonts
        uses: ./.github/actions/setup-ms-fonts

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/gofish-python/pyproject.toml

      - name: Install Node dependencies
        run: pnpm install

      - name: Install Python dependencies
        run: pip install -e packages/gofish-python vega_datasets scipy

      # No gofish-graphics build: the Python capture renders through the same
      # source-aliased Vite harness as js-capture (tests/harness/vite.config.ts).

      - name: Set up Playwright
        uses: ./.github/actions/setup-playwright

      - name: Capture Python DOM snapshots
        run: pnpm test:visual:capture-python

      # Uploaded even when stories failed to capture: capture-results.json
      # records the failures, and the parity review site shows them.
      # parity-summary.json carries the capture counts; python-parity's steps
      # add theirs to it.
      - name: Upload Python DOM capture
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: python-dom-capture
          path: |
            tests/tmp/python
            tests/tmp/parity-summary.json

  # Compares the Python capture against the JS capture of the same commit,
  # not against the snapshot baselines, so it runs in parallel with
  # visual-test and does not wait on the visual review (#872).
  python-parity:
    runs-on: ubuntu-latest
    needs: [js-capture, python-capture]
    # Same reasoning as visual-test: never let a failed capture turn this
    # required check into a skipped (= passing) one. python-capture is
    # skipped exactly when js-capture is.
    if: ${{ !cancelled() && needs.js-capture.result != 'skipped' }}
    permissions:
      pull-requests: write
      statuses: write # needed to publish parity-review-link commit status

    steps:
      - name: Fail if the JS capture failed
        if: needs.js-capture.result != 'success'
        run: |
          echo "::error::js-capture finished with '${{ needs.js-capture.result }}'; there is no capture to compare against."
          exit 1

      # fetch-depth 0: check-python-sync diffs against origin/main.
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install

      - name: Download JS DOM capture
        uses: actions/download-artifact@v5
        with:
          pattern: js-dom-capture-*
          merge-multiple: true
          path: tests/tmp/js

      # Before the sync checks: they add their counts to the
      # parity-summary.json this brings.
      - name: Download Python DOM capture
        if: always()
        uses: actions/download-artifact@v5
        with:
          name: python-dom-capture
          path: tests/tmp

      - name: Check Python story sync (coverage + spec sync)
        id: sync-check
        if: always()
        run: pnpm test:visual:check-python-sync
        env:
          BASE_REF: origin/main

      # Full per-StoryObj coverage audit. Errors for any JS export that has
      # no matching Python `story_*` and isn't on .python-sync-exempt.
      # Exempt entries surface as warnings (visible in the log) so the
      # known-not-yet-supported list doesn't silently rot.
      - name: Full Python parity coverage (per-StoryObj)
        id: sync-check-all
        if: always()
        run: pnpm test:visual:check-python-sync-all

      # A story that failed to capture fails this check, as it did when the
      # capture ran in this job; the steps below still compare what was
      # captured and publish the review site that lists the failures.
      - name: Fail if the Python capture failed
        if: always() && needs.python-capture.result != 'success'
        run: |
          echo "::error::python-capture finished with '${{ needs.python-capture.result }}'; see its log for the stories that failed."
          exit 1

      - name: Compare Python DOM against the JS capture
        id: compare-python
        if: always()
        run: pnpm test:visual:compare-python

      # Always build + deploy the parity review site, even when all
      # comparisons pass. Exempt and warning entries still need an
      # interface for browsing/promoting to real ports — those are
      # invisible from logs alone.
      - name: Build parity review site
        if: always()
        run: pnpm --filter @gofish/tests build:parity-review-site
        env:
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
          REVIEW_SHA: ${{ github.sha }}

      - name: Upload parity report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: parity-review-site
          path: tests/tmp/parity-review-site/

      - name: Deploy parity review site to Cloudflare Pages
        if: always()
        id: deploy-parity
        run: |
          output=$(npx wrangler@latest --cwd tests/tmp/parity-review-site pages deploy . \
            --project-name=gofish-parity-review \
            --branch="${{ github.head_ref || github.ref_name }}" \
            --commit-dirty=true 2>&1) || { echo "$output"; exit 1; }
          echo "$output"
          # Link this deployment's own URL, not the branch alias wrangler prints
          # last: the alias serves whichever run of the branch deployed most
          # recently, so a status on one commit could open (and accept against)
          # another commit's run.
          url=$(echo "$output" | grep -F 'Take a peek over at' | grep -oE 'https://[a-zA-Z0-9._-]+\.pages\.dev[a-zA-Z0-9._/-]*' | head -1)
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"

      - name: Publish parity-review-link commit status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const url = '${{ steps.deploy-parity.outputs.deployment-url }}';
            if (!url) return;

            const summaryPath = 'tests/tmp/parity-summary.json';
            let description = 'Click Details to review and accept parity diffs';
            // Default to pending so the fallback (no summary) prompts a click.
            // Real status derives from the summary below.
            let state = 'pending';
            try {
              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              // Use the export-level rollup the viewer renders. Single
              // source of truth: build-parity-review-site computes these
              // and writes them here.
              const parts = [];
              const fmt = (n, label, subParts) => {
                if (!(typeof n === 'number') || n === 0) return null;
                if (Array.isArray(subParts) && subParts.length > 0) {
                  return `${n} ${label} (${subParts.join(', ')})`;
                }
                return `${n} ${label}`;
              };
              const failures = fmt(
                summary.exportsFailures,
                'failures',
                summary.exportsFailParts
              );
              const warnings = fmt(
                summary.exportsWarnings,
                'warnings',
                summary.exportsWarnParts
              );
              const passed =
                typeof summary.exportsPassed === 'number' && summary.exportsPassed > 0
                  ? `${summary.exportsPassed} passed`
                  : null;
              if (failures) parts.push(failures);
              if (warnings) parts.push(warnings);
              if (passed) parts.push(passed);
              if (parts.length > 0) {
                description = parts.join(', ') + ' — click Details';
              }
              // Green check when nothing failed; otherwise stay pending so
              // the PR check pulls attention to the unresolved diffs.
              if (typeof summary.exportsFailures === 'number' && summary.exportsFailures === 0) {
                state = 'success';
              }
            } catch (e) {
              // keep fallback description + pending state
            }

            if (description.length > 140) description = description.slice(0, 140);

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state,
              target_url: url,
              description,
              context: 'Python Parity Review',
            });
