name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            In addition to the standard review, perform a documentation-sync check.
            Per CLAUDE.md, user-facing API changes and new/changed features must be
            documented in the same PR:
            - If this PR changes a public construct's options in
              packages/gofish-ir/src/frontend/descriptors.ts, the reference options tables
              under apps/docs/docs/{js,python}/api/ are generated from it: verify the
              `doc`/`default` fields were updated rather than the tables by hand. If a call
              shape or behavior changed, verify that page's handwritten Signature block and
              prose were updated too. Builder methods, color helpers, constraints and
              selection pages are fully handwritten and must be updated in the same PR,
              with the Python mirror page under apps/docs/docs/python/.
            - Pages with `handwritten: true` frontmatter are the maintainer's own prose. Do
              not flag missing prose updates there, and do flag it if this PR rewrote,
              expanded, or restructured that prose; code-block and factual corrections are
              the only allowed edits. If an API change left a handwritten page stale, the
              expected outcome is a GitHub issue plus a note in the PR description.
            - If a changed source file has a `// <gofish-wiki>` / @wiki comment block,
              verify the internals essay it names (apps/docs/docs/internals/) was updated
              in the same PR.
            - If documentation that should have been updated was not, flag it as a review
              finding naming the specific source change and the doc page that needs updating.
              If docs were updated appropriately, or no user-facing/feature change is present,
              say so briefly and do not raise a finding.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
